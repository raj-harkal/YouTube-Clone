    const INITIAL_NOTIFICATIONS = [

      {

        time: '1 day ago',
        unread: true
      }
    ];

    // LocalStorage helper so state persists across Chrome refreshes
    const loadFromStorage = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    };

    // ============================================================================
    // 3. CUSTOM SVG THUMBNAIL ARTWORK GENERATOR
    // ============================================================================
    const VideoThumbnail = ({ video, isHovered }) => {
      return (
        <div
          className={`relative w-full aspect-video rounded-xl overflow-hidden bg-gradient-to-br ${video.thumbnailGradient} select-none transition-all duration-300`}
        >
          <svg
            className="absolute inset-0 w-full h-full opacity-35"
            viewBox="0 0 400 225"
            fill="none"
          >
            <defs>
              <pattern id={`grid-${video.id}`} width="28" height="28" patternUnits="userSpaceOnUse">
                <path
                  d="M 28 0 L 0 0 0 28"

          <div className="absolute inset-0 flex items-center justify-between px-5 pt-4">
            <div className="max-w-[68%]">

                {video.channelName}

                {video.title.split('—')[0]}
              </div>
            </div>

            <div
              className={`w-11 h-11 rounded-full flex items-center justify-center transition-transform duration-300 shadow-lg ${
                isHovered ? 'scale-110 bg-red-600 text-white' : 'bg-black/50 text-white/90 backdrop-blur-sm border border-white/20'

            >

              className={`h-full bg-red-600 transition-all duration-700 ${

              }`}
            />
          </div>

          <div className="absolute bottom-2.5 right-2.5">

                <span className="w-1.5 h-1.5 rounded-full bg-white animate-pulse" />

              </span>
            ) : (
              <span className="px-1.5 py-0.5 rounded bg-black/80 text-white text-xs font-semibold tracking-tight">
                {video.duration}

    };

    // ============================================================================
    // 4. VIDEO CARD COMPONENT
    // ============================================================================
    function VideoCard({ video, darkMode, isSaved, onSelect, onToggleSave }) {
      const [isHovered, setIsHovered] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);

      return (
        <div
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => {
            setIsHovered(false);
            setMenuOpen(false);
          }}
          onClick={onSelect}
          className="group cursor-pointer flex flex-col"
        >
          <VideoThumbnail video={video} isHovered={isHovered} />

          <div className="flex items-start gap-3 mt-3 px-1">
            <div
              className={`w-9 h-9 rounded-full bg-gradient-to-br ${video.channelColor} text-white font-bold text-xs flex items-center justify-center shrink-0 mt-0.5 shadow-sm`}
            >
              {video.channelAvatar}
            </div>

            <div className="flex-1 min-w-0">
              <h3
                className={`font-semibold text-sm sm:text-[15px] leading-snug line-clamp-2 transition-colors ${
                  darkMode ? 'text-zinc-100 group-hover:text-blue-400' : 'text-zinc-900 group-hover:text-blue-600'
                }`}
              >
                {video.title}
              </h3>

              <div className="mt-1 flex items-center gap-1 text-xs text-zinc-400">
                <span className="truncate hover:text-zinc-200">{video.channelName}</span>
                {video.channelVerified && (
                  <Icons.CheckCircle2 className="w-3.5 h-3.5 text-zinc-400 shrink-0" />
                )}
              </div>

              <div className="text-xs text-zinc-400">
                {video.viewsText} • {video.uploadedAt}
              </div>
            </div>

            <div className="relative">
              <button
                type="button"
                onClick={(e) => {
                  e.stopPropagation();
                  setMenuOpen(!menuOpen);
                }}
                className={`p-1.5 rounded-full opacity-80 group-hover:opacity-100 transition-opacity ${
                  darkMode ? 'hover:bg-zinc-800 text-zinc-300' : 'hover:bg-zinc-200 text-zinc-700'
                }`}
              >
                <Icons.MoreVertical className="w-4 h-4" />
              </button>

              {menuOpen && (
                <div
                  onClick={(e) => e.stopPropagation()}
                  className={`absolute right-0 top-8 w-48 rounded-xl shadow-xl border py-1.5 z-20 ${
                    darkMode ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-zinc-200'
                  }`}
                >
                  <button
                    type="button"
                    onClick={(e) => {
                      setMenuOpen(false);
                      onToggleSave(e);
                    }}
                    className={`w-full px-3.5 py-2 text-left text-xs font-medium flex items-center gap-2.5 ${
                      darkMode ? 'hover:bg-zinc-800 text-zinc-200' : 'hover:bg-zinc-100 text-zinc-800'
                    }`}
                  >
                    <Icons.Bookmark className="w-3.5 h-3.5" />
                    <span>{isSaved ? 'Remove from Watch Later' : 'Save to Watch Later'}</span>
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 5. MAIN APPLICATION COMPONENT
    // ============================================================================
    function App() {
      const [darkMode, setDarkMode] = useState(() => loadFromStorage('yt_darkMode', true));
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [mobileDrawerOpen, setMobileDrawerOpen] = useState(false);
      const [activeNav, setActiveNav] = useState('Home');
      const [selectedCategory, setSelectedCategory] = useState('All');

      const [currentView, setCurrentView] = useState('home');
      const [activeVideoId, setActiveVideoId] = useState(INITIAL_VIDEOS[0].id);
      const [theaterMode, setTheaterMode] = useState(false);

      const [searchQuery, setSearchQuery] = useState('');
      const [searchFocused, setSearchFocused] = useState(false);
      const [upNextFilter, setUpNextFilter] = useState('All');
      const [autoplayNext, setAutoplayNext] = useState(true);

      // Persistent State via localStorage
      const [customVideos, setCustomVideos] = useState(() => loadFromStorage('yt_customVideos', []));
      const [likedVideoIds, setLikedVideoIds] = useState(() => loadFromStorage('yt_likedVideos', ['vid-1']));
      const [dislikedVideoIds, setDislikedVideoIds] = useState(() => loadFromStorage('yt_dislikedVideos', []));
      const [subscribedChannels, setSubscribedChannels] = useState(() => loadFromStorage('yt_subs', ['ch-bytecraft', 'ch-neural']));
      const [savedVideoIds, setSavedVideoIds] = useState(() => loadFromStorage('yt_saved', ['vid-2']));
      const [watchHistoryIds, setWatchHistoryIds] = useState(() => loadFromStorage('yt_history', ['vid-1', 'vid-2']));
      const [commentsByVideo, setCommentsByVideo] = useState(() => loadFromStorage('yt_comments', INITIAL_COMMENTS));
      const [likedCommentIds, setLikedCommentIds] = useState(() => loadFromStorage('yt_likedComments', []));

      const [descriptionExpanded, setDescriptionExpanded] = useState(false);
      const [commentInput, setCommentInput] = useState('');
      const [commentFocused, setCommentFocused] = useState(false);
      const [commentSort, setCommentSort] = useState('top');
      const [videoLoadError, setVideoLoadError] = useState(false);
      const [playbackRate, setPlaybackRate] = useState(1);

      const [uploadModalOpen, setUploadModalOpen] = useState(false);
      const [shareModalOpen, setShareModalOpen] = useState(false);
      const [voiceModalOpen, setVoiceModalOpen] = useState(false);
      const [notificationsOpen, setNotificationsOpen] = useState(false);
      const [notifications, setNotifications] = useState(INITIAL_NOTIFICATIONS);
      const [toastMessage, setToastMessage] = useState(null);

      const [newVideoTitle, setNewVideoTitle] = useState('');
      const [newVideoCategory, setNewVideoCategory] = useState('Coding');
      const [newVideoDescription, setNewVideoDescription] = useState('');
      const [newVideoStreamIdx, setNewVideoStreamIdx] = useState(0);

      const videoPlayerRef = useRef(null);
      const toastTimeoutRef = useRef(null);

      // Save to localStorage whenever state changes
      useEffect(() => { localStorage.setItem('yt_darkMode', JSON.stringify(darkMode)); }, [darkMode]);
      useEffect(() => { localStorage.setItem('yt_customVideos', JSON.stringify(customVideos)); }, [customVideos]);
      useEffect(() => { localStorage.setItem('yt_likedVideos', JSON.stringify(likedVideoIds)); }, [likedVideoIds]);
      useEffect(() => { localStorage.setItem('yt_dislikedVideos', JSON.stringify(dislikedVideoIds)); }, [dislikedVideoIds]);
      useEffect(() => { localStorage.setItem('yt_subs', JSON.stringify(subscribedChannels)); }, [subscribedChannels]);
      useEffect(() => { localStorage.setItem('yt_saved', JSON.stringify(savedVideoIds)); }, [savedVideoIds]);
      useEffect(() => { localStorage.setItem('yt_history', JSON.stringify(watchHistoryIds)); }, [watchHistoryIds]);
      useEffect(() => { localStorage.setItem('yt_comments', JSON.stringify(commentsByVideo)); }, [commentsByVideo]);
      useEffect(() => { localStorage.setItem('yt_likedComments', JSON.stringify(likedCommentIds)); }, [likedCommentIds]);

      const showToast = (msg) => {
        setToastMessage(msg);
        if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
        toastTimeoutRef.current = setTimeout(() => setToastMessage(null), 3000);
      };

      const allVideos = useMemo(() => [...customVideos, ...INITIAL_VIDEOS], [customVideos]);
      const activeVideo = useMemo(() => allVideos.find((v) => v.id === activeVideoId) || allVideos[0], [allVideos, activeVideoId]);

      const filteredVideos = useMemo(() => {
        let list = [...allVideos];
        if (activeNav === 'Subscriptions') list = list.filter((v) => subscribedChannels.includes(v.channelId));
        else if (activeNav === 'Liked Videos') list = list.filter((v) => likedVideoIds.includes(v.id));
        else if (activeNav === 'Watch Later') list = list.filter((v) => savedVideoIds.includes(v.id));
        else if (activeNav === 'History') list = watchHistoryIds.map((id) => allVideos.find((v) => v.id === id)).filter(Boolean);

        if (activeNav === 'Home' && selectedCategory !== 'All') {
          if (selectedCategory === 'Live') list = list.filter((v) => v.isLive || v.category === 'Live');
          else list = list.filter((v) => v.category === selectedCategory);
        }

        if (searchQuery.trim() !== '') {
          const q = searchQuery.toLowerCase().trim();
          list = list.filter(
            (v) =>
              v.title.toLowerCase().includes(q) ||
              v.channelName.toLowerCase().includes(q) ||
              v.category.toLowerCase().includes(q)
          );
        }
        return list;
      }, [allVideos, activeNav, selectedCategory, searchQuery, subscribedChannels, likedVideoIds, savedVideoIds, watchHistoryIds]);

      const recommendedVideos = useMemo(() => {
        const others = allVideos.filter((v) => v.id !== activeVideo.id);
        if (upNextFilter === 'Channel') {
          const sameChannel = others.filter((v) => v.channelId === activeVideo.channelId);
          return sameChannel.length > 0 ? sameChannel : others;
        }
        if (upNextFilter === 'Related') {
          const sameCat = others.filter((v) => v.category === activeVideo.category);
          return sameCat.length > 0 ? sameCat : others;
        }
        return others;
      }, [allVideos, activeVideo, upNextFilter]);

      const currentVideoComments = useMemo(() => {
        const raw = commentsByVideo[activeVideo.id] || [];
        const copy = [...raw];
        if (commentSort === 'newest') return copy.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        return copy.sort((a, b) => (b.likes || 0) - (a.likes || 0));
      }, [commentsByVideo, activeVideo.id, commentSort]);

      const handleSelectVideo = (videoId) => {
        setActiveVideoId(videoId);
        setCurrentView('watch');
        setDescriptionExpanded(false);
        setVideoLoadError(false);
        setMobileDrawerOpen(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setWatchHistoryIds((prev) => [videoId, ...prev.filter((id) => id !== videoId)]);
      };

      const handleNavigateSidebar = (navItem) => {
        setActiveNav(navItem);
        setCurrentView('home');
        setMobileDrawerOpen(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleToggleLike = (videoId) => {
        const isLiked = likedVideoIds.includes(videoId);
        setLikedVideoIds(isLiked ? likedVideoIds.filter((id) => id !== videoId) : [...likedVideoIds, videoId]);
        setDislikedVideoIds(dislikedVideoIds.filter((id) => id !== videoId));
        showToast(isLiked ? 'Removed from Liked videos' : 'Added to Liked videos');
      };

      const handleToggleDislike = (videoId) => {
        const isDisliked = dislikedVideoIds.includes(videoId);
        setDislikedVideoIds(isDisliked ? dislikedVideoIds.filter((id) => id !== videoId) : [...dislikedVideoIds, videoId]);
        setLikedVideoIds(likedVideoIds.filter((id) => id !== videoId));
      };

      const handleToggleSubscribe = (channelId, channelName) => {
        const isSubbed = subscribedChannels.includes(channelId);
        setSubscribedChannels(isSubbed ? subscribedChannels.filter((id) => id !== channelId) : [...subscribedChannels, channelId]);
        showToast(isSubbed ? `Unsubscribed from ${channelName}` : `Subscribed to ${channelName}`);
      };

      const handleToggleSaveVideo = (videoId, e) => {
        if (e) e.stopPropagation();
        const isSaved = savedVideoIds.includes(videoId);
        setSavedVideoIds(isSaved ? savedVideoIds.filter((id) => id !== videoId) : [...savedVideoIds, videoId]);
        showToast(isSaved ? 'Removed from Watch Later' : 'Saved to Watch Later');
      };

      const handleAddComment = (e) => {
        e.preventDefault();
        if (!commentInput.trim()) return;
        const newComment = {
          id: `c-${Date.now()}`,
          author: 'You (Creator)',
          avatar: 'YO',
          avatarColor: 'bg-red-600',
          time: 'Just now',
          text: commentInput.trim(),
          likes: 0,
          isOwn: true,
          timestamp: Date.now()
        };
        const existingList = commentsByVideo[activeVideo.id] || [];
        setCommentsByVideo((prev) => ({ ...prev, [activeVideo.id]: [newComment, ...existingList] }));
        setCommentInput('');
        setCommentFocused(false);
        showToast('Comment posted');
      };

      const handleDeleteComment = (commentId) => {
        const existingList = commentsByVideo[activeVideo.id] || [];
        setCommentsByVideo((prev) => ({ ...prev, [activeVideo.id]: existingList.filter((c) => c.id !== commentId) }));
        showToast('Comment deleted');
      };

      const handleCreateVideo = (e) => {
        e.preventDefault();
        if (!newVideoTitle.trim()) return;
        const newVidId = `vid-custom-${Date.now()}`;
        const createdVideo = {
          id: newVidId,
          title: newVideoTitle.trim(),
          channelId: 'ch-user-studio',
          channelName: 'Your Creator Studio',
          channelVerified: true,
          channelAvatar: 'YO',
          channelColor: 'from-red-600 to-rose-700',
          subscribersBase: 1250,
          views: 1,
          viewsText: '1 view',
          uploadedAt: 'Just now',
          timestampOrder: Date.now(),
          duration: '10:00',
          category: newVideoCategory,
          videoUrl: SAMPLE_STREAMS[newVideoStreamIdx % SAMPLE_STREAMS.length],
          thumbnailGradient: 'from-slate-900 via-indigo-950 to-blue-900',
          thumbnailAccent: '#38bdf8',
          thumbnailBadge: 'NEW UPLOAD',
          likesBase: 1,
          isLive: false,
          tags: [`#${newVideoCategory.replace(/\s+/g, '')}`, '#CreatorStudio'],
          description: newVideoDescription.trim() || `Uploaded via Creator Studio.\n\nChapters:\n00:00 Introduction\n00:10 Main Feature`
        };
        setCustomVideos((prev) => [createdVideo, ...prev]);
        setUploadModalOpen(false);
        setNewVideoTitle('');
        setNewVideoDescription('');
        handleSelectVideo(newVidId);
        showToast('Video published to feed!');
      };

      const handleSeekTimestamp = (timeStr) => {
        const parts = timeStr.split(':').map(Number);
        const seconds = parts.length === 2 ? parts[0] * 60 + parts[1] : 0;
        if (videoPlayerRef.current) {
          videoPlayerRef.current.currentTime = seconds;
          videoPlayerRef.current.play().catch(() => {});
          window.scrollTo({ top: 0, behavior: 'smooth' });
          showToast(`Jumped to ${timeStr}`);
        }
      };

      const handlePlaybackRateChange = () => {
        const rates = [1, 1.25, 1.5, 2, 0.75];
        const nextRate = rates[(rates.indexOf(playbackRate) + 1) % rates.length];
        setPlaybackRate(nextRate);
        if (videoPlayerRef.current) videoPlayerRef.current.playbackRate = nextRate;
        showToast(`Playback speed: ${nextRate}x`);
      };

      const formatCompactNumber = (num) => {
        if (num >= 1000000) return `${(num / 1000000).toFixed(2)}M`;
        if (num >= 1000) return `${(num / 1000).toFixed(1)}K`;
        return num.toString();
      };

      const renderDescriptionText = (text) => {
        return text.split('\n').map((line, idx) => {
          const match = line.match(/^(\d{2}:\d{2})\s+(.*)$/);
          if (match) {
            const [, timeStr, label] = match;
            return (
              <div key={idx} className="my-1 flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => handleSeekTimestamp(timeStr)}
                  className="px-1.5 py-0.5 rounded bg-blue-500/15 text-blue-400 hover:bg-blue-500/25 font-mono text-xs font-semibold"
                >
                  {timeStr}
                </button>
                <span>{label}</span>
              </div>
            );
          }
          return <p key={idx} className="min-h-[1.25rem]">{line}</p>;
        });
      };

      return (
        <div className={`min-h-screen transition-colors duration-200 ${darkMode ? 'bg-[#0f0f0f] text-zinc-100' : 'bg-white text-zinc-900'}`}>
          {/* TOP NAVBAR */}
          <header className={`sticky top-0 z-40 h-14 px-3 sm:px-4 flex items-center justify-between gap-2 border-b backdrop-blur-md ${darkMode ? 'bg-[#0f0f0f]/95 border-zinc-800/80' : 'bg-white/95 border-zinc-200'}`}>
            <div className="flex items-center gap-2 sm:gap-4">
              <button
                type="button"
                onClick={() => window.innerWidth < 768 ? setMobileDrawerOpen(!mobileDrawerOpen) : setSidebarOpen(!sidebarOpen)}
                className={`p-2 rounded-full transition-colors ${darkMode ? 'hover:bg-zinc-800 text-zinc-200' : 'hover:bg-zinc-100 text-zinc-700'}`}
              >
                <Icons.Menu className="w-5 h-5" />
              </button>

              <button
                type="button"
                onClick={() => {
                  setActiveNav('Home');
                  setSelectedCategory('All');
                  setSearchQuery('');
                  setCurrentView('home');
                  window.scrollTo({ top: 0, behavior: 'smooth' });
                }}
                className="flex items-center gap-1.5 focus:outline-none group"
              >
                <div className="w-8 h-6 rounded-lg bg-red-600 flex items-center justify-center shadow-sm group-hover:bg-red-500">
                  <Icons.Play className="w-3.5 h-3.5 text-white fill-white ml-0.5" />
                </div>
                <span className="font-bold text-lg tracking-tighter">YouTube</span>
              </button>
            </div>

            {/* SEARCH BAR */}
            <div className="flex-1 max-w-2xl flex items-center justify-center gap-2 mx-2">
              <div className="relative flex-1 flex items-center">
                <div className={`flex w-full items-center rounded-l-full border pl-4 pr-2 py-1.5 ${searchFocused ? 'border-blue-500' : darkMode ? 'border-zinc-700 bg-[#121212]' : 'border-zinc-300 bg-zinc-50'}`}>
                  <input
                    type="text"
                    value={searchQuery}
                    onFocus={() => setSearchFocused(true)}
                    onBlur={() => setTimeout(() => setSearchFocused(false), 180)}
                    onChange={(e) => {
                      setSearchQuery(e.target.value);
                      if (currentView !== 'home') setCurrentView('home');
                    }}
                    placeholder="Search videos, channels, or topics..."
                    className="w-full bg-transparent text-sm focus:outline-none placeholder:text-zinc-500"
                  />
                  {searchQuery && (
                    <button type="button" onClick={() => setSearchQuery('')} className="p-1 rounded-full hover:bg-zinc-800 text-zinc-400">
                      <Icons.X className="w-4 h-4" />
                    </button>
                  )}
                </div>
                <button
                  type="button"
                  onClick={() => setCurrentView('home')}
                  className={`px-4 sm:px-5 py-2 rounded-r-full border border-l-0 ${darkMode ? 'border-zinc-700 bg-zinc-800 hover:bg-zinc-700 text-zinc-200' : 'border-zinc-300 bg-zinc-100 hover:bg-zinc-200 text-zinc-700'}`}
                >
                  <Icons.Search className="w-4 h-4" />
                </button>
              </div>

              <button
                type="button"
                onClick={() => setVoiceModalOpen(true)}
                className={`hidden sm:flex p-2.5 rounded-full ${darkMode ? 'bg-zinc-800 hover:bg-zinc-700 text-zinc-200' : 'bg-zinc-100 hover:bg-zinc-200 text-zinc-700'}`}
              >
                <Icons.Mic className="w-4 h-4" />
              </button>
            </div>

            {/* RIGHT ACTIONS */}
            <div className="flex items-center gap-1.5 sm:gap-2">
              <button
                type="button"
                onClick={() => setUploadModalOpen(true)}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-medium ${darkMode ? 'bg-zinc-800 hover:bg-zinc-700 text-zinc-100' : 'bg-zinc-100 hover:bg-zinc-200 text-zinc-800'}`}
              >
                <Icons.Plus className="w-4 h-4" />
                <span className="hidden sm:inline">Create</span>
              </button>

              <button
                type="button"
                onClick={() => {
                  setDarkMode(!darkMode);
                  showToast(`Switched to ${!darkMode ? 'Dark' : 'Light'} mode`);
                }}
                className={`p-2 rounded-full ${darkMode ? 'hover:bg-zinc-800 text-zinc-200' : 'hover:bg-zinc-100 text-zinc-700'}`}
              >
                {darkMode ? <Icons.Sun className="w-5 h-5 text-amber-400" /> : <Icons.Moon className="w-5 h-5" />}
              </button>

              <div className="relative">
                <button
                  type="button"
                  onClick={() => setNotificationsOpen(!notificationsOpen)}
                  className={`relative p-2 rounded-full ${darkMode ? 'hover:bg-zinc-800 text-zinc-200' : 'hover:bg-zinc-100 text-zinc-700'}`}
                >
                  <Icons.Bell className="w-5 h-5" />
                  {notifications.some((n) => n.unread) && (
                    <span className="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-red-600" />
                  )}
                </button>

                {notificationsOpen && (
                  <div className={`absolute right-0 mt-2 w-80 rounded-2xl shadow-2xl border overflow-hidden z-50 ${darkMode ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-zinc-200'}`}>
                    <div className="px-4 py-3 border-b border-zinc-800/50 flex items-center justify-between">
                      <span className="font-semibold text-sm">Notifications</span>
                      <button
                        type="button"
                        onClick={() => setNotifications((prev) => prev.map((n) => ({ ...n, unread: false })))}
                        className="text-xs text-blue-400 hover:underline"
                      >
                        Mark all read
                      </button>
                    </div>
                    <div className="max-h-72 overflow-y-auto">
                      {notifications.map((notif) => (
                        <button
                          key={notif.id}
                          type="button"
                          onClick={() => {
                            setNotificationsOpen(false);
                            handleSelectVideo(notif.videoId);
                          }}
                          className={`w-full p-3.5 text-left flex items-start gap-3 ${darkMode ? 'hover:bg-zinc-800/70' : 'hover:bg-zinc-50'}`}
                        >
                          <div className={`w-8 h-8 rounded-full bg-gradient-to-br ${notif.avatarColor} text-white font-bold text-xs flex items-center justify-center shrink-0`}>
                            {notif.avatar}
                          </div>
                          <div className="flex-1 min-w-0">
                            <p className="text-xs font-medium line-clamp-2">{notif.title}</p>
                            <span className="text-[11px] text-zinc-400 mt-1 block">{notif.time}</span>
                          </div>
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              <button
                type="button"
                onClick={() => handleNavigateSidebar('Library')}
                className="w-8 h-8 rounded-full bg-gradient-to-tr from-red-600 to-orange-500 text-white font-bold text-xs flex items-center justify-center shadow"
              >
                YO
              </button>
            </div>
          </header>

          {/* MAIN LAYOUT */}
          <div className="flex">
            {currentView === 'home' && (
              <aside className={`hidden md:block shrink-0 sticky top-14 h-[calc(100vh-3.5rem)] overflow-y-auto select-none ${sidebarOpen ? 'w-60 px-3 py-3' : 'w-[74px] px-1.5 py-2'}`}>
                <div className="space-y-1">
                  {[
                    { id: 'Home', label: 'Home', icon: Icons.Home },
                    { id: 'Subscriptions', label: 'Subscriptions', icon: Icons.Users },
                    { id: 'Library', label: 'Library', icon: Icons.FolderHeart },
                    { id: 'History', label: 'History', icon: Icons.History },
                    { id: 'Liked Videos', label: 'Liked Videos', icon: Icons.ThumbsUp },
                    { id: 'Watch Later', label: 'Watch Later', icon: Icons.Clock }
                  ].map((item) => {
                    const IconComp = item.icon;
                    const isActive = activeNav === item.id && currentView === 'home';
                    return (
                      <button
                        key={item.id}
                        type="button"
                        onClick={() => handleNavigateSidebar(item.id)}
                        className={`w-full flex items-center rounded-xl transition-colors ${
                          sidebarOpen ? 'gap-4 px-3.5 py-2.5 text-sm' : 'flex-col justify-center gap-1 py-3 text-[10px]'
                        } ${
                          isActive
                            ? darkMode ? 'bg-zinc-800 text-white font-semibold' : 'bg-zinc-200 text-zinc-900 font-semibold'
                            : darkMode ? 'text-zinc-300 hover:bg-zinc-800/60' : 'text-zinc-700 hover:bg-zinc-100'
                        }`}
                      >
                        <IconComp className="w-5 h-5 shrink-0" />
                        <span className="truncate">{item.label}</span>
                      </button>
                    );
                  })}
                </div>
              </aside>
            )}

            {/* VIEW 1: HOME FEED */}
            {currentView === 'home' ? (
              <main className="flex-1 min-w-0 pb-16">
                <div className={`sticky top-14 z-30 px-4 sm:px-6 py-3 flex items-center gap-2 overflow-x-auto no-scrollbar border-b backdrop-blur-md ${darkMode ? 'bg-[#0f0f0f]/95 border-zinc-800/60' : 'bg-white/95 border-zinc-200/80'}`}>
                  {CATEGORIES.map((cat) => {
                    const IconComp = cat.icon;
                    const isSelected = selectedCategory === cat.id && activeNav === 'Home';
                    return (
                      <button
                        key={cat.id}
                        type="button"
                        onClick={() => {
                          setActiveNav('Home');
                          setSelectedCategory(cat.id);
                        }}
                        className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap shrink-0 ${
                          isSelected
                            ? darkMode ? 'bg-white text-black font-semibold' : 'bg-zinc-900 text-white font-semibold'
                            : darkMode ? 'bg-zinc-800 hover:bg-zinc-700 text-zinc-200' : 'bg-zinc-100 hover:bg-zinc-200 text-zinc-800'
                        }`}
                      >
                        {IconComp && <IconComp className="w-3.5 h-3.5" />}
                        <span>{cat.label}</span>
                      </button>
                    );
                  })}
                </div>

                <div className="p-4 sm:p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-4 gap-y-8">
                  {filteredVideos.map((video) => (
                    <VideoCard
                      key={video.id}
                      video={video}
                      darkMode={darkMode}
                      isSaved={savedVideoIds.includes(video.id)}
                      onSelect={() => handleSelectVideo(video.id)}
                      onToggleSave={(e) => handleToggleSaveVideo(video.id, e)}
                    />
                  ))}
                </div>
              </main>
            ) : (
              /* VIEW 2: WATCH PAGE */
              <main className="flex-1 min-w-0 px-0 sm:px-4 lg:px-6 py-0 sm:py-4 pb-16 max-w-[1720px] mx-auto">
                <div className={`flex flex-col ${theaterMode ? 'gap-6' : 'lg:flex-row gap-6'}`}>
                  <div className="flex-1 min-w-0">
                    {/* VIDEO PLAYER */}
                    <div className={`relative w-full bg-black overflow-hidden shadow-2xl aspect-video sm:rounded-2xl ${theaterMode ? 'max-h-[78vh]' : ''}`}>
                      <video
                        ref={videoPlayerRef}
                        key={activeVideo.videoUrl}
                        src={activeVideo.videoUrl}
                        controls
                        autoPlay
                        playsInline
                        onEnded={() => {
                          if (autoplayNext && recommendedVideos.length > 0) {
                            handleSelectVideo(recommendedVideos[0].id);
                          }
                        }}
                        className="w-full h-full object-contain bg-black"
                      />

                      <div className="absolute top-3 right-3 flex items-center gap-2">
                        <button
                          type="button"
                          onClick={handlePlaybackRateChange}
                          className="px-2.5 py-1 rounded-lg bg-black/70 hover:bg-black text-white text-xs font-bold border border-white/15"
                        >
                          {playbackRate}x
                        </button>
                        <button
                          type="button"
                          onClick={() => setTheaterMode(!theaterMode)}
                          className="hidden lg:flex p-1.5 rounded-lg bg-black/70 hover:bg-black text-white border border-white/15"
                        >
                          {theaterMode ? <Icons.Minimize2 className="w-4 h-4" /> : <Icons.Maximize2 className="w-4 h-4" />}
                        </button>
                      </div>
                    </div>

                    {/* VIDEO METADATA */}
                    <div className="px-3 sm:px-0 pt-3.5">
                      <h1 className="text-lg sm:text-xl font-bold leading-snug">{activeVideo.title}</h1>

                      <div className="mt-3 flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-zinc-800/60">
                        <div className="flex items-center justify-between sm:justify-start gap-3">
                          <div className="flex items-center gap-3">
                            <div className={`w-10 h-10 rounded-full bg-gradient-to-br ${activeVideo.channelColor} text-white font-bold text-sm flex items-center justify-center shrink-0`}>
                              {activeVideo.channelAvatar}
                            </div>
                            <div>
                              <div className="flex items-center gap-1.5">
                                <span className="font-semibold text-sm sm:text-base">{activeVideo.channelName}</span>
                                {activeVideo.channelVerified && <Icons.CheckCircle2 className="w-3.5 h-3.5 text-zinc-400" />}
                              </div>
                              <div className="text-xs text-zinc-400">
                                {formatCompactNumber(activeVideo.subscribersBase + (subscribedChannels.includes(activeVideo.channelId) ? 1 : 0))} subscribers
                              </div>
                            </div>
                          </div>

                          <button
                            type="button"
                            onClick={() => handleToggleSubscribe(activeVideo.channelId, activeVideo.channelName)}
                            className={`ml-2 px-4 py-2 rounded-full text-xs sm:text-sm font-semibold flex items-center gap-1.5 ${
                              subscribedChannels.includes(activeVideo.channelId)
                                ? darkMode ? 'bg-zinc-800 text-zinc-100' : 'bg-zinc-200 text-zinc-900'
                                : darkMode ? 'bg-white text-black' : 'bg-zinc-900 text-white'
                            }`}
                          >
                            {subscribedChannels.includes(activeVideo.channelId) ? 'Subscribed' : 'Subscribe'}
                          </button>
                        </div>

                        <div className="flex items-center gap-2 overflow-x-auto no-scrollbar">
                          <div className={`flex items-center rounded-full overflow-hidden ${darkMode ? 'bg-zinc-800' : 'bg-zinc-100'}`}>
                            <button
                              type="button"
                              onClick={() => handleToggleLike(activeVideo.id)}
                              className={`flex items-center gap-2 pl-4 pr-3 py-2 text-xs sm:text-sm font-medium ${likedVideoIds.includes(activeVideo.id) ? 'text-blue-400 font-semibold' : ''}`}
                            >
                              <Icons.ThumbsUp className="w-4 h-4" />
                              <span>{formatCompactNumber(activeVideo.likesBase + (likedVideoIds.includes(activeVideo.id) ? 1 : 0))}</span>
                            </button>
                            <div className="h-5 w-[1px] bg-zinc-700" />
                            <button
                              type="button"
                              onClick={() => handleToggleDislike(activeVideo.id)}
                              className={`pl-3 pr-4 py-2 text-xs sm:text-sm ${dislikedVideoIds.includes(activeVideo.id) ? 'text-red-400' : ''}`}
                            >
                              <Icons.ThumbsDown className="w-4 h-4" />
                            </button>
                          </div>

                          <button
                            type="button"
                            onClick={() => setShareModalOpen(true)}
                            className={`flex items-center gap-2 px-4 py-2 rounded-full text-xs sm:text-sm font-medium ${darkMode ? 'bg-zinc-800 hover:bg-zinc-700' : 'bg-zinc-100 hover:bg-zinc-200'}`}
                          >
                            <Icons.Share2 className="w-4 h-4" />
                            <span>Share</span>
                          </button>

                          <button
                            type="button"
                            onClick={(e) => handleToggleSaveVideo(activeVideo.id, e)}
                            className={`flex items-center gap-2 px-4 py-2 rounded-full text-xs sm:text-sm font-medium ${
                              savedVideoIds.includes(activeVideo.id)
                                ? 'bg-amber-500/20 text-amber-400 font-semibold'
                                : darkMode ? 'bg-zinc-800 hover:bg-zinc-700' : 'bg-zinc-100 hover:bg-zinc-200'
                            }`}
                          >
                            <Icons.Bookmark className="w-4 h-4" />
                            <span>{savedVideoIds.includes(activeVideo.id) ? 'Saved' : 'Save'}</span>
                          </button>
                        </div>
                      </div>

                      {/* EXPANDABLE DESCRIPTION */}
                      <div className={`mt-4 p-3.5 rounded-2xl text-sm ${darkMode ? 'bg-zinc-900 text-zinc-200' : 'bg-zinc-100 text-zinc-800'}`}>
                        <div className="flex items-center gap-3 font-semibold text-xs sm:text-sm mb-2">
                          <span>{activeVideo.viewsText}</span>
                          <span>•</span>
                          <span>{activeVideo.uploadedAt}</span>
                        </div>
                        <div className={`text-xs sm:text-sm leading-relaxed space-y-1 ${descriptionExpanded ? '' : 'line-clamp-2'}`}>
                          {renderDescriptionText(activeVideo.description)}
                        </div>
                        <button
                          type="button"
                          onClick={() => setDescriptionExpanded(!descriptionExpanded)}
                          className="mt-2 font-semibold text-xs sm:text-sm flex items-center gap-1 text-blue-400 hover:underline"
                        >
                          <span>{descriptionExpanded ? 'Show less' : '...more'}</span>
                        </button>
                      </div>

                      {/* COMMENTS SECTION */}
                      <div className="mt-6">
                        <div className="flex items-center gap-6 mb-5">
                          <h2 className="text-base sm:text-lg font-bold flex items-center gap-2">
                            <Icons.MessageSquare className="w-5 h-5 text-zinc-400" />
                            <span>{currentVideoComments.length} Comments</span>
                          </h2>
                        </div>

                        <form onSubmit={handleAddComment} className="flex items-start gap-3 mb-7">
                          <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-red-600 to-orange-500 text-white font-bold text-xs flex items-center justify-center shrink-0">
                            YO
                          </div>
                          <div className="flex-1">
                            <input
                              type="text"
                              value={commentInput}
                              onFocus={() => setCommentFocused(true)}
                              onChange={(e) => setCommentInput(e.target.value)}
                              placeholder="Add a comment..."
                              className={`w-full pb-1.5 bg-transparent text-sm border-b focus:outline-none ${darkMode ? 'border-zinc-700 focus:border-white' : 'border-zinc-300 focus:border-zinc-900'}`}
                            />
                            {(commentFocused || commentInput.trim() !== '') && (
                              <div className="flex items-center justify-end gap-2 mt-2.5">
                                <button
                                  type="button"
                                  onClick={() => { setCommentInput(''); setCommentFocused(false); }}
                                  className="px-3.5 py-1.5 rounded-full text-xs font-semibold text-zinc-400"
                                >
                                  Cancel
                                </button>
                                <button
                                  type="submit"
                                  className="px-4 py-1.5 rounded-full text-xs font-semibold bg-blue-500 hover:bg-blue-400 text-black"
                                >
                                  Comment
                                </button>
                              </div>
                            )}
                          </div>
                        </form>

                        <div className="space-y-5">
                          {currentVideoComments.map((comment) => (
                            <div key={comment.id} className="flex items-start gap-3">
                              <div className={`w-9 h-9 rounded-full ${comment.avatarColor || 'bg-indigo-600'} text-white font-bold text-xs flex items-center justify-center shrink-0`}>
                                {comment.avatar}
                              </div>
                              <div className="flex-1 min-w-0">
                                <div className="flex items-center gap-2">
                                  <span className="text-xs font-semibold">@{comment.author.toLowerCase().replace(/\s+/g, '')}</span>
                                  <span className="text-[11px] text-zinc-400">{comment.time}</span>
                                </div>
                                <p className="text-sm mt-1 leading-relaxed">{comment.text}</p>
                                {comment.isOwn && (
                                  <button
                                    type="button"
                                    onClick={() => handleDeleteComment(comment.id)}
                                    className="mt-1.5 text-xs text-red-400 hover:underline flex items-center gap-1"
                                  >
                                    <Icons.Trash2 className="w-3 h-3" />
                                    <span>Delete</span>
                                  </button>
                                )}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* UP NEXT SIDEBAR */}
                  <aside className={`px-3 sm:px-0 ${theaterMode ? 'w-full' : 'w-full lg:w-[390px] shrink-0'}`}>
                    <div className="flex items-center justify-between mb-3">
                      <span className="font-bold text-sm sm:text-base">Up Next</span>
                    </div>
                    <div className="space-y-3">
                      {recommendedVideos.map((recVid) => (
                        <div
                          key={recVid.id}
                          onClick={() => handleSelectVideo(recVid.id)}
                          className={`group flex gap-2.5 rounded-xl p-1.5 -mx-1.5 cursor-pointer ${darkMode ? 'hover:bg-zinc-900' : 'hover:bg-zinc-100'}`}
                        >
                          <div className="w-40 shrink-0">
                            <VideoThumbnail video={recVid} isHovered={false} />
                          </div>
                          <div className="flex-1 min-w-0 py-0.5">
                            <h3 className="text-xs sm:text-sm font-semibold leading-snug line-clamp-2 group-hover:text-blue-400">
                              {recVid.title}
                            </h3>
                            <div className="mt-1 text-xs text-zinc-400 truncate">{recVid.channelName}</div>
                            <div className="text-[11px] text-zinc-400 mt-0.5">{recVid.viewsText} • {recVid.uploadedAt}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </aside>
                </div>
              </main>
            )}
          </div>

          {/* UPLOAD VIDEO MODAL */}
          {uploadModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75">
              <div className={`w-full max-w-lg rounded-2xl border shadow-2xl overflow-hidden ${darkMode ? 'bg-zinc-900 border-zinc-800 text-zinc-100' : 'bg-white border-zinc-200 text-zinc-900'}`}>
                <div className="px-5 py-4 border-b border-zinc-800/60 flex items-center justify-between">
                  <h2 className="font-bold text-base">Upload Video to Creator Studio</h2>
                  <button type="button" onClick={() => setUploadModalOpen(false)} className="p-1.5 rounded-full hover:bg-zinc-800/60">
                    <Icons.X className="w-5 h-5" />
                  </button>
                </div>
                <form onSubmit={handleCreateVideo} className="p-5 space-y-4">
                  <div>
                    <label className="block text-xs font-semibold uppercase text-zinc-400 mb-1.5">Video Title *</label>
                    <input
                      type="text"
                      required
                      value={newVideoTitle}
                      onChange={(e) => setNewVideoTitle(e.target.value)}
                      placeholder="e.g., Building an AI App in 10 Minutes"
                      className={`w-full px-3.5 py-2.5 rounded-xl border text-sm ${darkMode ? 'bg-zinc-950 border-zinc-800' : 'bg-zinc-50 border-zinc-300'}`}
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setUploadModalOpen(false)} className="px-4 py-2 rounded-full text-xs font-semibold">Cancel</button>
                    <button type="submit" className="px-5 py-2 rounded-full bg-red-600 hover:bg-red-500 text-white text-xs font-semibold">Publish Video</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* SHARE MODAL */}
          {shareModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75">
              <div className={`w-full max-w-md rounded-2xl border shadow-2xl p-5 ${darkMode ? 'bg-zinc-900 border-zinc-800 text-zinc-100' : 'bg-white border-zinc-200 text-zinc-900'}`}>
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-bold text-base">Share Video</h3>
                  <button type="button" onClick={() => setShareModalOpen(false)}><Icons.X className="w-5 h-5" /></button>
                </div>
                <div className={`flex items-center justify-between gap-2 p-2.5 rounded-xl border ${darkMode ? 'bg-zinc-950 border-zinc-800' : 'bg-zinc-50 border-zinc-300'}`}>
                  <span className="text-xs font-mono truncate px-1">https://youtu.be/{activeVideo.id}</span>
                  <button
                    type="button"
                    onClick={() => {
                      setShareModalOpen(false);
                      showToast('Video link copied to clipboard');
                    }}
                    className="px-3.5 py-1.5 rounded-full bg-blue-500 text-black font-semibold text-xs"
                  >
                    Copy
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* VOICE SEARCH MODAL */}
          {voiceModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75">
              <div className={`w-full max-w-sm rounded-2xl border shadow-2xl p-6 text-center ${darkMode ? 'bg-zinc-900 border-zinc-800 text-zinc-100' : 'bg-white border-zinc-200 text-zinc-900'}`}>
                <div className="flex justify-end">
                  <button type="button" onClick={() => setVoiceModalOpen(false)}><Icons.X className="w-5 h-5" /></button>
                </div>
                <div className="w-16 h-16 rounded-full bg-red-600/20 text-red-500 flex items-center justify-center mx-auto my-4 animate-pulse">
                  <Icons.Mic className="w-8 h-8" />
                </div>
                <h3 className="font-bold text-base mb-3">Click a voice preset to filter:</h3>
                <div className="flex flex-wrap justify-center gap-2">
                  {['Coding', 'WebGPU', 'Gaming', 'Quantum'].map((term) => (
                    <button
                      key={term}
                      type="button"
                      onClick={() => {
                        setSearchQuery(term);
                        setCurrentView('home');
                        setVoiceModalOpen(false);
                      }}
                      className="px-3 py-1.5 rounded-full text-xs font-medium bg-red-600 text-white"
                    >
                      "{term}"
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATION */}
          {toastMessage && (
            <div className="fixed bottom-5 left-5 z-50 flex items-center gap-2.5 px-4 py-3 rounded-xl bg-zinc-900 text-white border border-zinc-700 shadow-2xl text-xs sm:text-sm font-medium">
              <Icons.CheckCircle2 className="w-4 h-4 text-emerald-400 shrink-0" />
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
